name: Publish pinned llama.cpp source image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/llama-source.yml
      - docker/llama-source/Dockerfile
      - docker/llama-source/.dockerignore
      - docker/llama-source/source.json
      - docker/llama-source/export-llama-source.sh
      - docker/llama-source/verify-llama-source.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llama-source-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out packaging recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and verify source distribution
        id: build
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/qwen35-cpu-dev:llama-src-v0.7.0"
          verification_image="llama-source-verification:local"
          docker build --platform linux/amd64 \
            --file docker/llama-source/Dockerfile \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --target verification --tag "$verification_image" docker/llama-source
          docker build --platform linux/amd64 \
            --file docker/llama-source/Dockerfile \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$image" docker/llama-source
          mkdir exported-source
          source_container=$(docker create "$image" /source-data-only)
          trap 'docker rm "$source_container" >/dev/null' EXIT
          docker cp "$source_container:/opt/llama-source/." ./exported-source/
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/exported-source,dst=/opt/llama-source,readonly" \
            "$verification_image" verify-llama-source 2>&1 | tee source-verification.log
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/exported-source,dst=/bundle,readonly" \
            "$verification_image" bash -euc '
              bash /bundle/export-llama-source.sh /tmp/exported-source
              if bash /bundle/export-llama-source.sh /tmp/exported-source; then exit 1; fi
              test -s /tmp/exported-source/LICENSE
              printf "PASS: copied source bundle exported; existing destination preserved\n"
            ' 2>&1 | tee export-verification.log
          docker image inspect "$image" --format '{{json .}}' > image-info.json
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Publish source image to the existing GHCR package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker_config_dir=$(mktemp -d)
          export DOCKER_CONFIG="$docker_config_dir"
          trap 'rm -rf -- "$docker_config_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$IMAGE_OWNER" --password-stdin
          docker push "$IMAGE" 2>&1 | tee publish.log
          {
            echo "Image: \`$IMAGE\`"
            echo
            echo '```text'
            tail -n 2 publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-source-build-records
          path: |
            source-verification.log
            export-verification.log
            image-info.json
            publish.log
          if-no-files-found: ignore
