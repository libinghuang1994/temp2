name: Publish pinned llama.cpp source image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/llama-source.yml
      - docker/llama-source/Dockerfile
      - docker/llama-source/.dockerignore
      - docker/llama-source/source.json
      - docker/llama-source/export-llama-source.sh
      - docker/llama-source/verify-llama-source.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llama-source-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out packaging recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and verify source distribution
        id: build
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/qwen35-cpu-dev:0.2.0-llama-src-v0.7.0"
          docker build --platform linux/amd64 \
            --file docker/llama-source/Dockerfile \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$image" docker/llama-source
          docker run --rm --network none "$image" verify-llama-source 2>&1 | tee source-verification.log
          docker run --rm --network none "$image" verify-jupyter-env 2>&1 | tee jupyter-verification.log
          docker image inspect "$image" --format '{{json .}}' > image-info.json
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Publish source image to the existing GHCR package
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ steps.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker_config_dir=$(mktemp -d)
          export DOCKER_CONFIG="$docker_config_dir"
          trap 'rm -rf -- "$docker_config_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$IMAGE_OWNER" --password-stdin
          docker push "$IMAGE" 2>&1 | tee publish.log
          {
            echo "Image: \`$IMAGE\`"
            echo
            echo '```text'
            tail -n 2 publish.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-source-build-records
          path: |
            source-verification.log
            jupyter-verification.log
            image-info.json
            publish.log
          if-no-files-found: ignore
